name = "tennis"
main = "src/index.ts"
compatibility_date = "2024-12-24"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "stringing_history_db"
database_id = "00d418f6-a0ec-488b-8cd8-88f56d0016fa"
migrations_dir = "migrations"

# KV for sessions (선택 - 현재는 D1에 세션 저장)

[vars]
APP_NAME = "스트링 작업 이력"
SESSION_COOKIE_NAME = "sh_session"
SESSION_TTL_SECONDS = "600" # 10 minutes (보안을 위해 짧게 설정)

[observability]
enabled = true

[build]
command = ""