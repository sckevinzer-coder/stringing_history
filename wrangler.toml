name = "stringing"
main = "src/index.ts"
compatibility_date = "2024-12-24"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "stringing_history_db"
database_id = "00d418f6-a0ec-488b-8cd8-88f56d0016fa"
migrations_dir = "migrations"

# KV for sessions (선택 - 현재는 D1에 세션 저장)

[vars]
APP_NAME = "스트링노트"
SESSION_COOKIE_NAME = "sh_session"
SESSION_TTL_SECONDS = "1800" # 30 minutes (슬라이딩 만료: 활동 시 연장)

[observability]
enabled = true

[build]
command = ""